name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch MFi certs from upstream release
        run: |
          mkdir -p "$GITHUB_WORKSPACE/shared/src/main/assets/offline-mfi"
          curl -sL -o /tmp/legacy.apk "https://github.com/programmerguohuajing/DiPlay-Legacy-Android/releases/download/v0.2.22/DiPlay-v0.2.22-legacy-release.apk"
          unzip -o /tmp/legacy.apk "assets/offline-mfi/*" -d /tmp/mfi-extract
          cp /tmp/mfi-extract/assets/offline-mfi/* "$GITHUB_WORKSPACE/shared/src/main/assets/offline-mfi/"
          ls -la "$GITHUB_WORKSPACE/shared/src/main/assets/offline-mfi/"
      - name: Fix gradlew permissions
        run: chmod +x ./gradlew
      - name: Build debug APK
        run: ./gradlew :mobile:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-ExistingWifi-debug
          path: mobile/build/outputs/apk/debug/*.apk